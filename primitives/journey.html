<body>
<main class="app">
  <header class="top">
    <button type="button" class="menu-btn" id="menu-btn" aria-haspopup="dialog" aria-controls="menu"><span class="readout" id="readout"></span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
    <p class="blurb" id="blurb"></p>
  </header>
  <section class="stage" id="stage" aria-label="Board"></section>
  <footer class="bar" id="bar">
    <div class="bar-main" id="bar-main">
      <button type="button" class="tb" id="undo-btn" aria-disabled="true" aria-keyshortcuts="Z" title="Undo your last move (Z)"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 14 4 9l5-5"/><path d="M4 9h9.5a6.5 6.5 0 1 1 0 13H11"/></svg><span class="tb-label">Undo</span></button>
      <button type="button" class="tb" id="tool-btn" data-tool="fill" title="Tap or click fills a square. Press to mark squares empty instead."><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><rect x="4.5" y="4.5" width="15" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect class="m-fill" x="8" y="8" width="8" height="8" rx="1.2" fill="currentColor"/><circle class="m-dot" cx="12" cy="12" r="2" fill="currentColor"/></svg><span class="tb-label">Filling</span></button>
      <button type="button" class="tb" id="rules-btn" hidden><span class="rb-icon" aria-hidden="true"></span><span class="tb-label">Rules</span></button>
      <button type="button" class="tb" id="reset-btn" aria-disabled="true" title="Clear this board (Undo brings it back)"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M15.6 10.2a4.2 4.2 0 1 0-.9 4.6"/><path d="M15.9 6.9v3.5h-3.5"/></svg><span class="tb-label">Clear board</span></button>
      <button type="button" class="tb" id="back-btn" hidden title="Back to all eight tiles. Your marks here are kept."><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9.17 3.5v17M14.83 3.5v17M3.5 9.17h17M3.5 14.83h17"/><rect x="9.17" y="9.17" width="5.66" height="5.66" fill="currentColor" stroke="none"/></svg><span class="tb-label">All tiles</span></button>
      <button type="button" class="tb" id="new-btn" title="New game: the whole sequence starts over"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2.5" y="6.5" width="15" height="15" rx="2"/><rect x="6.5" y="10.5" width="7" height="7" rx="1"/><rect x="8.75" y="12.75" width="2.5" height="2.5" fill="currentColor" stroke="none"/><path d="M19 1.5v7M15.5 5h7"/></svg><span class="tb-label">New game</span></button>
      <button type="button" class="tb" id="theme-btn" title="Switch to dark"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor"/></svg><span class="tb-label">Theme</span></button>
    </div>
    <div class="bar-ask" id="ask" hidden>
      <p class="ask-text" id="ask-text"></p>
      <button type="button" class="tb" id="ask-no" aria-describedby="ask-text" aria-keyshortcuts="Escape"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="tb-label">Keep playing</span></button>
      <button type="button" class="tb ask-yes" id="ask-yes" aria-describedby="ask-text"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2.5" y="6.5" width="15" height="15" rx="2"/><rect x="6.5" y="10.5" width="7" height="7" rx="1"/><rect x="8.75" y="12.75" width="2.5" height="2.5" fill="currentColor" stroke="none"/><path d="M19 1.5v7M15.5 5h7"/></svg><span class="tb-label">New game</span></button>
    </div>
  </footer>
  <p class="keys" id="keys"><span id="keys-text">Tap fills · hold or right-click marks empty · drag paints · arrows, Space, X, Z</span></p>
  <dialog class="sheet" id="menu" aria-labelledby="menu-title"><div class="sheet-in">
    <header class="sheet-head"><h2 id="menu-title">Journey</h2><form method="dialog"><button class="sheet-x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form></header>
    <div class="sheet-body">
      <p class="lv-meta" id="lv-meta"></p>
      <ol class="lv-grid" id="lv-grid"></ol>
      <section aria-labelledby="others-title">
        <h3 id="others-title">Other games</h3>
        <ul class="others" id="others"></ul>
      </section>
      <section>
        <label class="setting"><input type="checkbox" id="ring-opt"> Focus outline</label>
      </section>
    </div>
  </div></dialog>
  <p id="live" class="sr-only" role="status" aria-live="polite"></p>
</main>
